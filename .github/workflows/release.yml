name: Release

"on":
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions: {}

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
      sha: ${{ steps.publication.outputs.sha }}
      tag: ${{ steps.publication.outputs.tag }}
      version: ${{ steps.publication.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Dispatch and verify release PR CI
        if: steps.release.outputs.prs != '' && steps.release.outputs.prs != '[]'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          count=$(jq 'length' <<<"$RELEASE_PRS")
          for ((index = 0; index < count; index++)); do
            pr_number=$(jq -er ".[${index}].number | select(type == \"number\" and . > 0 and floor == .)" <<<"$RELEASE_PRS")
            read -r branch sha head_repository < <(gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GH_REPO}/pulls/${pr_number}" \
              --jq '[.head.ref, .head.sha, .head.repo.full_name] | @tsv')
            [[ -n "$branch" && "$sha" =~ ^[0-9a-f]{40}$ && "$head_repository" == "$GH_REPO" ]]

            encoded_branch=$(jq -rn --arg value "$branch" '$value | @uri')
            runs_url="/repos/${GH_REPO}/actions/workflows/ci.yml/runs?event=workflow_dispatch&branch=${encoded_branch}&per_page=20"
            previous_run_id=$(gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$runs_url" \
              --jq '[.workflow_runs[].id] | max // 0')
            [[ "$previous_run_id" =~ ^[0-9]+$ ]]
            gh workflow run ci.yml --repo "$GH_REPO" --ref "$branch"
            run_id=""
            for _ in {1..30}; do
              run_id=$(gh api \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$runs_url" \
                --jq "[.workflow_runs[] | select(.head_sha == \"${sha}\" and .id > ${previous_run_id}) | .id] | max // empty")
              [[ -n "$run_id" ]] && break
              sleep 10
            done
            [[ -n "$run_id" ]] || {
              echo "No workflow_dispatch CI run found for ${branch} at ${sha}" >&2
              exit 1
            }

            gh run watch "$run_id" --repo "$GH_REPO" --exit-status
            actual_sha=$(gh api "/repos/${GH_REPO}/actions/runs/${run_id}" --jq .head_sha)
            [[ "$actual_sha" == "$sha" ]] || {
              echo "CI run ${run_id} used ${actual_sha}, expected ${sha}" >&2
              exit 1
            }
          done

      - name: Resolve release publication
        id: publication
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CREATED" == "true" ]]; then
            [[ "$RELEASE_SHA" == "$TRIGGER_SHA" ]]
          elif [[ "$RUN_ATTEMPT" -gt 1 ]]; then
            [[ "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
            RELEASE_VERSION=$(gh api "/repos/${GH_REPO}/contents/package.json?ref=${TRIGGER_SHA}" --jq .content |
              base64 --decode | jq -er '.version | select(type == "string")')
            RELEASE_TAG="v${RELEASE_VERSION}"
            api_error=$(mktemp)
            trap 'rm -f "$api_error"' EXIT
            if ! release=$(gh api "/repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" \
              --jq 'select(.draft == false) | [.id, .tag_name] | @tsv' 2>"$api_error"); then
              grep -q 'HTTP 404' "$api_error" && exit 0
              cat "$api_error" >&2
              exit 1
            fi
            [[ -n "$release" ]] || exit 0
            read -r release_id release_tag <<<"$release"
            [[ "$release_id" =~ ^[0-9]+$ && "$release_tag" == "$RELEASE_TAG" ]] || exit 0
            if ! tag_sha=$(gh api "/repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha 2>"$api_error"); then
              grep -q 'HTTP 404' "$api_error" && exit 0
              cat "$api_error" >&2
              exit 1
            fi
            [[ "$tag_sha" == "$TRIGGER_SHA" ]] || exit 0
            RELEASE_SHA="$TRIGGER_SHA"
          else
            exit 0
          fi

          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" == "v${RELEASE_VERSION}" ]]
          read -r release_id release_tag draft < <(gh api "/repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" \
            --jq '[.id, .tag_name, .draft] | @tsv')
          [[ "$release_id" =~ ^[0-9]+$ && "$release_tag" == "$RELEASE_TAG" && "$draft" == "false" ]]
          tag_sha=$(gh api "/repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha)
          [[ "$tag_sha" == "$RELEASE_SHA" ]]

          {
            echo "publish=true"
            echo "sha=${RELEASE_SHA}"
            echo "tag=${RELEASE_TAG}"
            echo "version=${RELEASE_VERSION}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
      x64_sha256: ${{ steps.package.outputs.x64_sha256 }}
      arm64_sha256: ${{ steps.package.outputs.arm64_sha256 }}
    steps:
      - name: Check out released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate, build, and package
        id: package
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$RELEASE_TAG" == "v${RELEASE_VERSION}" ]]
          [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$RELEASE_SHA" ]]

          bun install --frozen-lockfile
          bun run check
          package_version=$(node -p "require('./package.json').version")
          [[ "$package_version" == "$RELEASE_VERSION" ]]
          [[ "$(./dist/tx --version)" == "$RELEASE_VERSION" ]]
          [[ "$(file -b dist/tx)" == "ELF 64-bit LSB executable, x86-64,"* ]]
          [[ "$(file -b dist/tx-linux-arm64)" == "ELF 64-bit LSB executable, ARM aarch64,"* ]]

          mkdir -p release package
          npm pack --ignore-scripts --json --pack-destination package > package/pack.json
          archive=$(jq -r '.[0].filename' package/pack.json)
          [[ "$archive" == "fx-tx-${RELEASE_VERSION}.tgz" ]]
          [[ "$(tar -xOf "package/${archive}" package/package.json | jq -r .version)" == "$RELEASE_VERSION" ]]
          [[ "$(tar -xOf "package/${archive}" package/package.json | jq -c .cpu)" == '["x64"]' ]]
          contents=$(tar -tzf "package/${archive}")
          [[ "$contents" != *tx-linux-arm64* ]]

          cp dist/tx release/tx-linux-x64
          cp dist/tx-linux-arm64 release/tx-linux-arm64
          cp "package/${archive}" "release/${archive}"
          {
            echo "archive=${archive}"
            echo "archive_sha256=$(sha256sum "release/${archive}" | cut -d ' ' -f 1)"
            echo "x64_sha256=$(sha256sum release/tx-linux-x64 | cut -d ' ' -f 1)"
            echo "arm64_sha256=$(sha256sum release/tx-linux-arm64 | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          path: release/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  # The arm64 executable is cross-compiled above; this is the only place it
  # runs on real arm64 hardware, and nothing is published until it has.
  smoke-arm64:
    name: Smoke test arm64
    needs:
      - release
      - build
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Download release candidates
        uses: actions/download-artifact@v4
        with:
          name: release-candidates
          path: release

      - name: Run the arm64 executable natively
        env:
          ARM64_SHA256: ${{ needs.build.outputs.arm64_sha256 }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "aarch64" ]]
          [[ "$ARM64_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "${ARM64_SHA256}  release/tx-linux-arm64" | sha256sum --check --strict -
          chmod 755 release/tx-linux-arm64

          sandbox=$(mktemp -d)
          trap 'rm -rf "$sandbox"' EXIT
          export HOME="${sandbox}/home"
          export XDG_CONFIG_HOME="${sandbox}/config"
          export XDG_DATA_HOME="${sandbox}/data"
          export XDG_CACHE_HOME="${sandbox}/cache"
          export XDG_STATE_HOME="${sandbox}/state"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_STATE_HOME"

          version=$(release/tx-linux-arm64 --version)
          [[ "$version" == "$RELEASE_VERSION" ]] || {
            echo "tx-linux-arm64 reported ${version}, expected ${RELEASE_VERSION}" >&2
            exit 1
          }
          help=$(release/tx-linux-arm64 --help)
          grep -qF 'Usage: tx' <<<"$help"
          grep -qF 'marketplace' <<<"$help"

  # Gated on the smoke test as well as the build, so a release is published
  # everywhere or nowhere: the package version cannot be republished later.
  publish:
    name: Publish
    needs:
      - release
      - build
      - smoke-arm64
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download release candidates
        uses: actions/download-artifact@v4
        with:
          name: release-candidates
          path: release

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@fx"

      - name: Publish package and release assets
        env:
          ARCHIVE: ${{ needs.build.outputs.archive }}
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
          ARM64_SHA256: ${{ needs.build.outputs.arm64_sha256 }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          X64_SHA256: ${{ needs.build.outputs.x64_sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == "v${RELEASE_VERSION}" ]]
          [[ "$ARCHIVE" == "fx-tx-${RELEASE_VERSION}.tgz" ]]
          [[ "$(gh api "/repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha)" == "$RELEASE_SHA" ]]
          (
            cd release
            printf '%s  %s\n' \
              "$X64_SHA256" tx-linux-x64 \
              "$ARM64_SHA256" tx-linux-arm64 \
              "$ARCHIVE_SHA256" "$ARCHIVE" |
              sha256sum --check --strict -
          )
          chmod 755 release/tx-linux-x64 release/tx-linux-arm64

          published=$(npm view "@fx/tx@${RELEASE_VERSION}" version --registry https://npm.pkg.github.com 2>/dev/null || true)
          if [[ -z "$published" ]]; then
            npm publish "./release/${ARCHIVE}" --registry https://npm.pkg.github.com
          else
            [[ "$published" == "$RELEASE_VERSION" ]]
            echo "@fx/tx@${RELEASE_VERSION} is already published; refusing to overwrite it."
          fi
          [[ "$(npm view "@fx/tx@${RELEASE_VERSION}" version --registry https://npm.pkg.github.com)" == "$RELEASE_VERSION" ]]
          mkdir published
          npm pack "@fx/tx@${RELEASE_VERSION}" --ignore-scripts --pack-destination published --registry https://npm.pkg.github.com
          cmp "release/${ARCHIVE}" "published/${ARCHIVE}"

          (cd release && sha256sum tx-linux-x64 tx-linux-arm64 > SHA256SUMS)
          gh release upload "$RELEASE_TAG" release/tx-linux-x64 release/tx-linux-arm64 release/SHA256SUMS --clobber

          read -r x64_size arm64_size checksum_size < <(gh api "/repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" \
            --jq '[([.assets[] | select(.name == "tx-linux-x64") | .size][0] // 0), ([.assets[] | select(.name == "tx-linux-arm64") | .size][0] // 0), ([.assets[] | select(.name == "SHA256SUMS") | .size][0] // 0)] | @tsv')
          [[ "$x64_size" == "$(stat -c %s release/tx-linux-x64)" ]]
          [[ "$arm64_size" == "$(stat -c %s release/tx-linux-arm64)" ]]
          [[ "$checksum_size" == "$(stat -c %s release/SHA256SUMS)" ]]
