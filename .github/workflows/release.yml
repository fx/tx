name: Release

"on":
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: write
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Dispatch and verify release PR CI
        if: steps.release.outputs.prs != '' && steps.release.outputs.prs != '[]'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          count=$(jq 'length' <<<"$RELEASE_PRS")
          for ((index = 0; index < count; index++)); do
            pr_number=$(jq -er ".[${index}].number | select(type == \"number\" and . > 0 and floor == .)" <<<"$RELEASE_PRS")
            read -r branch sha head_repository < <(gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GH_REPO}/pulls/${pr_number}" \
              --jq '[.head.ref, .head.sha, .head.repo.full_name] | @tsv')
            [[ -n "$branch" && "$sha" =~ ^[0-9a-f]{40}$ && "$head_repository" == "$GH_REPO" ]]

            dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            encoded_branch=$(jq -rn --arg value "$branch" '$value | @uri')
            gh workflow run ci.yml --repo "$GH_REPO" --ref "$branch"
            run_id=""
            for _ in {1..30}; do
              run_id=$(gh api \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GH_REPO}/actions/workflows/ci.yml/runs?event=workflow_dispatch&branch=${encoded_branch}&per_page=20" \
                --jq "[.workflow_runs[] | select(.head_sha == \"${sha}\" and .created_at >= \"${dispatched_at}\")][0].id // empty")
              [[ -n "$run_id" ]] && break
              sleep 10
            done
            [[ -n "$run_id" ]] || {
              echo "No workflow_dispatch CI run found for ${branch} at ${sha}" >&2
              exit 1
            }

            gh run watch "$run_id" --repo "$GH_REPO" --exit-status
            actual_sha=$(gh api "/repos/${GH_REPO}/actions/runs/${run_id}" --jq .head_sha)
            [[ "$actual_sha" == "$sha" ]] || {
              echo "CI run ${run_id} used ${actual_sha}, expected ${sha}" >&2
              exit 1
            }
          done

      - name: Resolve release publication
        id: publication
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CREATED" == "true" ]]; then
            [[ "$RELEASE_SHA" == "$TRIGGER_SHA" ]]
          elif [[ "$RUN_ATTEMPT" -gt 1 ]]; then
            RELEASE_SHA="$TRIGGER_SHA"
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            RELEASE_VERSION=$(gh api "/repos/${GH_REPO}/contents/package.json?ref=${RELEASE_SHA}" --jq .content |
              base64 --decode | jq -er '.version | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+([+-][0-9A-Za-z.-]+)?$"))')
            RELEASE_TAG="v${RELEASE_VERSION}"
          else
            exit 0
          fi

          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" == "v${RELEASE_VERSION}" ]]
          read -r release_id release_tag draft < <(gh api "/repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" \
            --jq '[.id, .tag_name, .draft] | @tsv')
          [[ "$release_id" =~ ^[0-9]+$ && "$release_tag" == "$RELEASE_TAG" && "$draft" == "false" ]]
          tag_sha=$(gh api "/repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha)
          [[ "$tag_sha" == "$RELEASE_SHA" ]]

          {
            echo "publish=true"
            echo "sha=${RELEASE_SHA}"
            echo "tag=${RELEASE_TAG}"
            echo "version=${RELEASE_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out released commit
        if: steps.publication.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.publication.outputs.sha }}
          fetch-depth: 0

      - name: Set up Bun
        if: steps.publication.outputs.publish == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        if: steps.publication.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@fx"

      - name: Validate, package, and publish
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.publication.outputs.sha }}
          RELEASE_TAG: ${{ steps.publication.outputs.tag }}
          RELEASE_VERSION: ${{ steps.publication.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$RELEASE_TAG" == "v${RELEASE_VERSION}" ]]
          [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$RELEASE_SHA" ]]

          bun install --frozen-lockfile
          bun run check
          package_version=$(node -p "require('./package.json').version")
          [[ "$package_version" == "$RELEASE_VERSION" ]]
          [[ "$(./dist/tx --version)" == "$RELEASE_VERSION" ]]

          mkdir -p release package
          npm pack --ignore-scripts --json --pack-destination package > package/pack.json
          archive=$(jq -r '.[0].filename' package/pack.json)
          [[ "$archive" == "fx-tx-${RELEASE_VERSION}.tgz" ]]
          [[ "$(tar -xOf "package/${archive}" package/package.json | jq -r .version)" == "$RELEASE_VERSION" ]]

          published=$(npm view "@fx/tx@${RELEASE_VERSION}" version --registry https://npm.pkg.github.com 2>/dev/null || true)
          if [[ -z "$published" ]]; then
            npm publish "package/${archive}" --registry https://npm.pkg.github.com
          else
            [[ "$published" == "$RELEASE_VERSION" ]]
            echo "@fx/tx@${RELEASE_VERSION} is already published; refusing to overwrite it."
          fi
          [[ "$(npm view "@fx/tx@${RELEASE_VERSION}" version --registry https://npm.pkg.github.com)" == "$RELEASE_VERSION" ]]
          mkdir published
          npm pack "@fx/tx@${RELEASE_VERSION}" --ignore-scripts --pack-destination published --registry https://npm.pkg.github.com
          cmp "package/${archive}" "published/${archive}"

          cp dist/tx release/tx-linux-x64
          chmod 755 release/tx-linux-x64
          (cd release && sha256sum tx-linux-x64 > SHA256SUMS)
          gh release upload "$RELEASE_TAG" release/tx-linux-x64 release/SHA256SUMS --clobber

          expected_size=$(stat -c %s release/tx-linux-x64)
          read -r actual_size checksum_size < <(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '[([.assets[] | select(.name == "tx-linux-x64") | .size][0] // 0), ([.assets[] | select(.name == "SHA256SUMS") | .size][0] // 0)] | @tsv')
          [[ "$actual_size" == "$expected_size" && "$checksum_size" -gt 0 ]]
