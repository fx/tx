name: CI

"on":
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Detect documentation-only changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # Anything the comparison cannot see runs the full suite. A missing,
          # unknown, or all-zero base means the changed files are unknown, and
          # skipping on an unknown diff would let source changes past the gate.
          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No comparable base commit; running the full suite."
            echo "documentation_only=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          if [ -z "$changed" ]; then
            echo "No changed files; running the full suite."
            echo "documentation_only=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qvE '^docs/|\.md$'; then
            echo "documentation_only=false" >>"$GITHUB_OUTPUT"
          else
            echo "Documentation-only change; skipping the quality commands."
            echo "documentation_only=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.scope.outputs.documentation_only != 'true'
        with:
          bun-version: 1.3.14
      - run: bun ci
        if: steps.scope.outputs.documentation_only != 'true'
      - run: bun run check
        if: steps.scope.outputs.documentation_only != 'true'
