  - name: updates
    path: specs/updates/
    description: User-invoked updating of marketplaces and the executable through generic update participants, with automatic checking prohibited.
    status: active
  - name: config
    path: specs/config/
    description: Shared per-user JSON config persistence supplied by a bundled plugin, covering validated key definition, reads, writes, and atomic storage.
    status: active

