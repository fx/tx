specs:
  - name: architecture
    path: specs/architecture/
    description: Generic core runtime, neutral composition, packaging, and development conventions for tx.
    status: active
  - name: plugin-system
    path: specs/plugin-system/
    description: Generic plugin hosting, opaque capability registration, and externalized marketplace-plugin ownership contracts.
    status: active
  - name: dialogs
    path: specs/dialogs/
    description: Shared terminal dialogs supplied by a bundled plugin, covering single-choice selection with type-to-filter and a bounded viewport, aligned multi-cell option rows with headers, text input composed through user-provided options, and a themed Norton Commander presentation.
    status: active
  - name: updates
    path: specs/updates/
    description: User-invoked updating of marketplaces and the executable through generic update participants, with automatic checking prohibited.
    status: active
  - name: config
    path: specs/config/
    description: Shared per-user JSON config persistence supplied by a bundled plugin, covering validated key definition, reads, writes, and atomic storage.
    status: active
  - name: theming
    path: specs/theming/
    description: Named appearance variables supplied by a bundled plugin, covering the default greyscale Norton Commander theme, plugin overrides, and colour enablement.
    status: active
  - name: grid
    path: specs/grid/
    description: Aligned cell layout supplied by a bundled plugin, covering table and flowed presentations, one-shot printing, interactive row selection, and row actions.
    status: active

