    path: specs/plugin-system/
    description: Generic plugin hosting, opaque capability registration, and externalized marketplace-plugin ownership contracts.
    status: active
  - name: dialogs
    path: specs/dialogs/
    description: Shared terminal dialogs supplied by a bundled plugin, covering single-choice selection with type-to-filter and a bounded viewport, text input composed through user-provided options, and a greyscale Norton Commander presentation.
